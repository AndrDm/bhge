<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental Apps</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 256px;
            background: #f4f4f4;
            border-right: 1px solid #ccc;
            padding: 10px;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .sidebar button {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            text-align: left;
        }

        .sidebar button:hover {
            background: #e8e8e8;
        }

        .content {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Apps</h2>
            <button onclick="loadApp('conv/index.html')">
                Converter to DICONDE
            </button>
            <button onclick="loadApp('noise/index.html')">
                ASTM E1695 Test Pattern
            </button>
        </div>

        <div class="content">
            <iframe
                id="appFrame"
                src="conv/index.html">
            </iframe>
        </div>


    </div>

    <script>
        function loadApp(path) {
            document.getElementById('appFrame').src = path;
        }
    </script>
</body>
</html>
