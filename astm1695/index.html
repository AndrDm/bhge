<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ASTM E1695-20 Analysis Tool</title>

	<!-- Trunk: build the Rust crate to wasm and wire up the glue.
	     (wasm-opt is explicitly disabled: binaryen crashes on this large
	     bundle; the cargo release profile already optimizes the wasm.) -->
	
<script type="module">
import init, * as bindings from './astm_e1695_egui-d8c6b569e4695b56.js';
const wasm = await init({ module_or_path: './astm_e1695_egui-d8c6b569e4695b56_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

	<!-- The compute web worker: built from the astm1695_worker crate; the
	     boot script (worker scope) loads its glue and answers compute
	     requests off the UI thread. -->
	
	

	<!-- Sample DICONDE images, served at ./dcm/ for the in-app sample list -->
	

	<!-- Names of the sample images (generated by build.rs), fetched by the
	     web app to populate the sample list -->
	

	<style>
		body,
		html {
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
		}

		#the_canvas_id {
			width: 100%;
			height: 100%;
			display: block;
		}

		.centered {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			font: 16px sans-serif;
			color: #808080;
			text-align: center;
		}
	</style>
<link rel="modulepreload" href="./astm_e1695_egui-d8c6b569e4695b56.js" crossorigin="anonymous" integrity="sha384-+nnPnPtnr2kVKAytCjJ2TijRlmQQ02UKbfe/Q1CUbpAFKr3XFBjlwierE+bWSkJq"><link rel="preload" href="./astm_e1695_egui-d8c6b569e4695b56_bg.wasm" crossorigin="anonymous" integrity="sha384-8rWkbUqSogpMgS0/aRLadbdPHXn7TynyFqsLP3OaYoqchv//SeYNSFyIVnAaUWe2" as="fetch" type="application/wasm"></head>
<body>
	<!-- egui runs here (canvas id is hardcoded in main.rs - keep both in sync) -->
	<canvas id="the_canvas_id"></canvas>

	<!-- removed by main.rs once the app has started -->
	<div class="centered" id="loading_text">Loading&hellip;</div>
</body>
</html>
